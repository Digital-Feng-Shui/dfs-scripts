# Runs on every pull request and every push to main.
# 1. Builds main.min.js + styles.min.css and tests the buy flow on the REAL site
#    (live + staging) with the new files swapped in. Nothing is published by the test.
# 2. Only on main, and only when the test is green: tags a new version and puts it live
#    (GitHub Pages, which Webflow loads). Red = nothing changes on the site.
name: Test and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build

      - name: Buy-flow test (new code on its own, old Webflow hotfix removed)
        run: npx playwright test

      - name: Buy-flow test (new code together with the old Webflow hotfix)
        run: npx playwright test
        env:
          BLOCK_HOTFIX: '0'

      - name: Save test report (screenshots and traces)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Digital-Feng-Shui/dfs-scripts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: live
      cancel-in-progress: false
    permissions:
      contents: write   # push the version tag
      pages: write      # publish to GitHub Pages
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Version tags: Rim tags versions by hand (commit "v1.7.20: ...", then tag v1.7.20).
      # Rules: never re-create or move an existing tag; if this commit has (or soon gets) a
      # tag, use that one; only tag a version named in the commit message.
      - name: Pick the version number
        id: version
        run: |
          pick() {
            git fetch --tags --quiet origin
            git tag --points-at HEAD --list 'v[0-9]*' | sort -V | tail -n1
          }
          existing=$(pick)
          wanted=$(git log -1 --format=%s | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+' || true)
          # Commit named after a version but not tagged yet: give a hand-made tag 3 minutes to arrive.
          if [ -z "$existing" ] && [ -n "$wanted" ]; then
            for i in $(seq 1 18); do
              existing=$(pick); [ -n "$existing" ] && break
              git rev-parse -q --verify "refs/tags/$wanted" >/dev/null && break
              sleep 10
            done
          fi
          if [ -n "$existing" ]; then
            echo "This commit already has tag $existing"
            echo "version=$existing" >> "$GITHUB_OUTPUT"; echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          latest=${latest:-v0.0.0}
          # Tag only when the commit message names a free version higher than the latest tag.
          # Otherwise no tag (so the workflow never takes a number Rim is about to use):
          # the build is labelled "<latest tag>+<commit>".
          if [ -n "$wanted" ] && ! git rev-parse -q --verify "refs/tags/$wanted" >/dev/null \
             && [ "$(printf '%s\n%s\n' "$latest" "$wanted" | sort -V | tail -n1)" = "$wanted" ]; then
            echo "New version $wanted (latest tag was $latest)"
            echo "version=$wanted" >> "$GITHUB_OUTPUT"; echo "new=true" >> "$GITHUB_OUTPUT"
          else
            v="$latest+$(git rev-parse --short HEAD)"
            echo "No version in the commit message: build $v, no tag"
            echo "version=$v" >> "$GITHUB_OUTPUT"; echo "new=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build
        env:
          DFS_VERSION: ${{ steps.version.outputs.version }}

      - name: Tag the version
        if: steps.version.outputs.new == 'true'
        run: |
          v="${{ steps.version.outputs.version }}"
          git tag "$v"
          # No --force: if someone pushed this tag in the meantime, theirs stays.
          git push origin "refs/tags/$v" || echo "::warning::Tag $v already exists on GitHub, left it as it is"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Put it live
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Check the live files
        run: bash .github/scripts/check-live.sh "${{ steps.deploy.outputs.page_url }}" "${{ steps.version.outputs.version }}"
